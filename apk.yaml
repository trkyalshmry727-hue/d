                      int w = Math.max(box.width() + dp(24), (int) (sc.width() * 0.35f));
                      w = Math.min(w, (int) (sc.width() * 0.92f));
                      float lineH = box.height() / (float) Math.max(1, lines);
                      float px = Math.max(dp(14), Math.min(dp(34), lineH * 0.8f));
