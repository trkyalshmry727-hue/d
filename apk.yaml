name: بناء تطبيق ترجمان الألعاب

on:
  push:
    paths:
      - '.github/workflows/apk.yml'
      - '.github/workflows/apk.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: تجهيز جافا
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تجهيز قريدل
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: كتابة ملفات التطبيق
        run: |
          mkdir -p app app/src/main app/src/main/java/com/tarjuman/app app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/res/values
          cat > app/build.gradle <<'__END__'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.tarjuman.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.tarjuman.app'
                  minSdk 26
                  targetSdk 34
                  versionCode 3
                  versionName '1.2'
                  ndk {
                      abiFilters 'arm64-v8a', 'armeabi-v7a'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'com.google.mlkit:text-recognition:16.0.0'
              implementation 'com.google.mlkit:translate:17.0.2'
              implementation 'net.java.dev.jna:jna:5.18.1@aar'
              implementation 'com.alphacephei:vosk-android:0.3.75@aar'
          }
          __END__
          cat > app/src/main/AndroidManifest.xml <<'__END__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <queries>
                  <package android:name="com.playstation.remoteplay" />
              </queries>

              <application
                  android:label="ترجمان الألعاب"
                  android:icon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".TranslatorService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection|microphone" />
              </application>
          </manifest>
          __END__
          cat > app/src/main/java/com/tarjuman/app/MainActivity.java <<'__END__'
          package com.tarjuman.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.media.projection.MediaProjectionManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.speech.tts.TextToSpeech;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.Locale;

          public class MainActivity extends Activity {
              static final int REQ_CAPTURE = 7;
              static final String REMOTE_PLAY = "com.playstation.remoteplay";

              LinearLayout root;
              TextView overlayState;
              SharedPreferences prefs;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences("t", MODE_PRIVATE);
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS", "android.permission.RECORD_AUDIO"}, 1);
                  } else {
                      requestPermissions(new String[]{"android.permission.RECORD_AUDIO"}, 1);
                  }

                  ScrollView sv = new ScrollView(this);
                  sv.setBackgroundColor(0xFF071A1C);
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                  int p = dp(18);
                  root.setPadding(p, p, p, p);
                  sv.addView(root);
                  setContentView(sv);

                  title("ترجمان الألعاب");
                  note("يترجم ألعاب البلايستيشن للعربي فوق تطبيق «التشغيل عن بعد» وأنت تلعب.");
                  overlayState = note("");

                  button("١. السماح بالظهور فوق التطبيقات", v -> {
                      try {
                          startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse("package:" + getPackageName())));
                      } catch (Exception e) {
                          toast("افتح إعدادات الجوال وفعّل «الظهور فوق التطبيقات» لترجمان الألعاب");
                      }
                  });
                  button("٢. تشغيل زر الترجمة الطائر", v -> startBubble());
                  button("٣. فتح التشغيل عن بعد", v -> openRemotePlay());

                  check("نطق الترجمة بصوت عربي", "speak", true);
                  check("سماع أصوات الشخصيات وترجمتها", "listen", true);
                  check("إظهار لوحة الفحص تحت الزر الطائر", "diag", true);
                  check("خط ترجمة كبير", "big", false);
                  check("الترجمة فوق الشاشة بدل مكان الكلام الإنجليزي", "top", false);

                  button("🔊 تجربة الصوت العربي", v -> testVoice());
                  button("إيقاف زر الترجمة", v -> {
                      stopService(new Intent(this, TranslatorService.class));
                      toast("انطفى زر الترجمة");
                  });

                  note("طريقة الاستخدام:\n"
                          + "١. اضغط «السماح بالظهور فوق التطبيقات» وفعّل ترجمان الألعاب، وارجع.\n"
                          + "٢. اضغط «تشغيل زر الترجمة الطائر»، واختر «الشاشة كاملة» ثم «ابدأ».\n"
                          + "٣. في التشغيل عن بعد اربط البلايستيشن وافتح اللعبة.\n"
                          + "٤. شغّل الترجمة الإنجليزية من إعدادات اللعبة.\n"
                          + "٥. اضغط الزر الطائر «ابدأ الترجمة». وإذا دخلت القوائم اضغط «إيقاف الترجمة».\n\n"
                          + "الترجمة العربية تنحط مكان الكلام الإنجليزي اللي تحت وتغطيه. بتشوفها ترمش رمشة خفيفة كل ثانية، لأن التطبيق يشيلها لحظة عشان يشوف إذا تغيّر الكلام اللي تحتها.\n\n"
                          + "تبي الترجمة على التلفزيون؟ اعرض شاشة الجوال على التلفزيون من «عرض الشاشة» أو «سمارت فيو» في جوالك.\n\n"
                          + "الزر الطائر تقدر تسحبه بإصبعك لأي مكان.\n\n"
                          + "لوحة الفحص تحت الزر تقول لك وش يشتغل ووش لا: الشاشة، صوت اللعبة، السمع، الصوت العربي، ووش سمع ووش قرأ. إذا فيه مشكلة صوّرها.");
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  boolean ok = Settings.canDrawOverlays(this);
                  overlayState.setText(ok ? "✓ مسموح بالظهور فوق التطبيقات"
                          : "✗ لازم تسمح بالظهور فوق التطبيقات (الخطوة ١)");
                  overlayState.setTextColor(ok ? 0xFF7DFFB0 : 0xFFFF8A80);
              }

              TextToSpeech testTts;

              void testVoice() {
                  if (testTts != null) {
                      testTts.shutdown();
                      testTts = null;
                  }
                  testTts = new TextToSpeech(this, st -> {
                      if (st != TextToSpeech.SUCCESS) {
                          toast("محرك الصوت ما اشتغل في جوالك");
                          return;
                      }
                      int r = testTts.setLanguage(new Locale("ar"));
                      if (r < 0) {
                          toast("الصوت العربي مو منزّل في جوالك، نزّله من الصفحة اللي بتنفتح");
                          try {
                              startActivity(new Intent(TextToSpeech.Engine.ACTION_INSTALL_TTS_DATA));
                          } catch (Exception e) {
                              toast("افتح الإعدادات وابحث عن «تحويل النص إلى كلام» ونزّل العربية");
                          }
                          return;
                      }
                      testTts.speak("أهلاً، هذا صوت الترجمة العربي. إذا تسمعني، كل شي تمام.", TextToSpeech.QUEUE_FLUSH, null, "t");
                  });
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  for (int i = 0; i < permissions.length; i++) {
                      if ("android.permission.RECORD_AUDIO".equals(permissions[i]) && grantResults.length > i
                              && grantResults[i] != PackageManager.PERMISSION_GRANTED) {
                          toast("بدون إذن المايك التطبيق ما يقدر يسمع أصوات الشخصيات");
                      }
                  }
              }

              @Override
              protected void onDestroy() {
                  if (testTts != null) testTts.shutdown();
                  super.onDestroy();
              }

              void startBubble() {
                  if (!Settings.canDrawOverlays(this)) {
                      toast("اسمح أول بالظهور فوق التطبيقات (الخطوة ١)");
                      return;
                  }
                  MediaProjectionManager m = (MediaProjectionManager) getSystemService(MEDIA_PROJECTION_SERVICE);
                  startActivityForResult(m.createScreenCaptureIntent(), REQ_CAPTURE);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != REQ_CAPTURE) return;
                  if (resultCode == RESULT_OK && data != null) {
                      Intent i = new Intent(this, TranslatorService.class);
                      i.putExtra("code", resultCode);
                      i.putExtra("data", data);
                      startForegroundService(i);
                      toast("تم ✓ الزر الطائر شغال، افتح اللعبة واضغطه");
                      openRemotePlay();
                  } else {
                      toast("لازم تضغط «ابدأ» عشان التطبيق يقدر يقرأ الشاشة");
                  }
              }

              void openRemotePlay() {
                  Intent i = getPackageManager().getLaunchIntentForPackage(REMOTE_PLAY);
                  if (i != null) {
                      startActivity(i);
                      return;
                  }
                  toast("نزّل تطبيق التشغيل عن بعد من سوني");
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse("market://details?id=" + REMOTE_PLAY)));
                  } catch (Exception e) {
                      try {
                          startActivity(new Intent(Intent.ACTION_VIEW,
                                  Uri.parse("https://play.google.com/store/apps/details?id=" + REMOTE_PLAY)));
                      } catch (Exception ignored) {
                      }
                  }
              }

              int dp(int v) {
                  return Math.round(v * getResources().getDisplayMetrics().density);
              }

              GradientDrawable round(int color, int r) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(r);
                  return g;
              }

              TextView title(String s) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextColor(0xFF2FD1BF);
                  t.setTextSize(28);
                  t.setTypeface(Typeface.DEFAULT_BOLD);
                  t.setGravity(Gravity.CENTER);
                  t.setPadding(0, dp(10), 0, dp(6));
                  root.addView(t);
                  return t;
              }

              TextView note(String s) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextColor(0xFFB8D4D1);
                  t.setTextSize(15);
                  t.setLineSpacing(0, 1.3f);
                  t.setPadding(0, dp(6), 0, dp(6));
                  root.addView(t);
                  return t;
              }

              Button button(String s, View.OnClickListener l) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setAllCaps(false);
                  b.setTextColor(Color.WHITE);
                  b.setTextSize(17);
                  b.setBackground(round(0xFF1FA89A, dp(16)));
                  b.setPadding(dp(12), dp(14), dp(12), dp(14));
                  b.setOnClickListener(l);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  lp.topMargin = dp(10);
                  root.addView(b, lp);
                  return b;
              }

              CheckBox check(String s, String key, boolean def) {
                  CheckBox c = new CheckBox(this);
                  c.setText(s);
                  c.setTextColor(Color.WHITE);
                  c.setTextSize(16);
                  c.setChecked(prefs.getBoolean(key, def));
                  c.setOnCheckedChangeListener((v, on) -> prefs.edit().putBoolean(key, on).apply());
                  c.setPadding(0, dp(8), 0, dp(8));
                  root.addView(c);
                  return c;
              }

              void toast(String s) {
                  Toast.makeText(this, s, Toast.LENGTH_LONG).show();
              }
          }
          __END__
          cat > app/src/main/java/com/tarjuman/app/TranslatorService.java <<'__END__'
          package com.tarjuman.app;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.content.pm.ServiceInfo;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.Rect;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.media.AudioAttributes;
          import android.media.AudioFormat;
          import android.media.AudioPlaybackCaptureConfiguration;
          import android.media.AudioRecord;
          import android.media.Image;
          import android.media.ImageReader;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.os.Build;
          import android.os.Handler;
          import android.os.HandlerThread;
          import android.os.IBinder;
          import android.os.Looper;
          import android.speech.tts.TextToSpeech;
          import android.util.DisplayMetrics;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import com.google.mlkit.nl.translate.TranslateLanguage;
          import com.google.mlkit.nl.translate.Translation;
          import com.google.mlkit.nl.translate.Translator;
          import com.google.mlkit.nl.translate.TranslatorOptions;
          import com.google.mlkit.vision.common.InputImage;
          import com.google.mlkit.vision.text.Text;
          import com.google.mlkit.vision.text.TextRecognition;
          import com.google.mlkit.vision.text.TextRecognizer;
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions;

          import org.json.JSONArray;
          import org.json.JSONObject;
          import org.vosk.LibVosk;
          import org.vosk.LogLevel;
          import org.vosk.Model;
          import org.vosk.Recognizer;
          import org.vosk.android.StorageService;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.nio.ByteBuffer;
          import java.util.HashMap;
          import java.util.Locale;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.function.Consumer;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class TranslatorService extends Service {
              static final Pattern SPEAKER = Pattern.compile("^([A-Z][A-Za-z.'\\- ]{1,22}?)\\s*[:;]\\s*(.{2,})$");

              WindowManager wm;
              LinearLayout bubbleBox;
              TextView bubble, diag, sub, vsub;
              WindowManager.LayoutParams bp, sp, vp;

              MediaProjection mp;
              VirtualDisplay vd;
              ImageReader reader;
              HandlerThread thread;
              Handler bg, main;

              TextRecognizer recog;
              Translator mlTr;
              TextToSpeech tts;
              boolean ttsOk = false;
              final ExecutorService net = Executors.newSingleThreadExecutor();
              final HashMap<String, String> cache = new HashMap<>();
              SharedPreferences prefs;

              volatile boolean running = false;
              volatile boolean busy = false;
              int W, H;
              String pending = "", lastDone = "";
              int pendingCount = 0;
              long blackSince = 0;
              boolean warned = false;
              long lastOcrAt = 0;

              // الصوت
              AudioRecord ar;
              Thread audioThread;
              volatile boolean audioOn = false;
              Model vmodel;
              volatile Recognizer vrec;
              volatile long lastSoundAt = 0;
              volatile String heard = "";
              String lastHeardDone = "";

              // لوحة الفحص
              volatile String diagScreen = "اضغط «ابدأ الترجمة»";
              volatile String diagModel = "يجهز…";
              volatile String diagAudio = "يجهز…";
              volatile String diagTts = "يجهز…";
              volatile String lastRead = "";

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              boolean hasMic() {
                  return checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED;
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  startFg();
                  if (intent == null) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  if (mp != null) return START_NOT_STICKY;

                  prefs = getSharedPreferences("t", MODE_PRIVATE);
                  int code = intent.getIntExtra("code", 0);
                  Intent data;
                  if (Build.VERSION.SDK_INT >= 33) data = intent.getParcelableExtra("data", Intent.class);
                  else data = intent.getParcelableExtra("data");

                  MediaProjectionManager m = (MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                  try {
                      mp = m.getMediaProjection(code, data);
                  } catch (Exception e) {
                      mp = null;
                  }
                  if (mp == null) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }

                  main = new Handler(Looper.getMainLooper());
                  thread = new HandlerThread("capture");
                  thread.start();
                  bg = new Handler(thread.getLooper());

                  mp.registerCallback(new MediaProjection.Callback() {
                      @Override
                      public void onStop() {
                          main.post(() -> stopSelf());
                      }
                  }, main);

                  DisplayMetrics dm = getResources().getDisplayMetrics();
                  int a = Math.max(dm.widthPixels, dm.heightPixels);
                  int b = Math.min(dm.widthPixels, dm.heightPixels);
                  float s = Math.min(1f, 1600f / a);
                  W = Math.round(a * s);
                  H = Math.round(b * s);
                  reader = ImageReader.newInstance(W, H, PixelFormat.RGBA_8888, 2);
                  vd = mp.createVirtualDisplay("tarjuman", W, H, dm.densityDpi,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, reader.getSurface(), null, bg);

                  recog = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS);
                  TranslatorOptions opts = new TranslatorOptions.Builder()
                          .setSourceLanguage(TranslateLanguage.ENGLISH)
                          .setTargetLanguage(TranslateLanguage.ARABIC)
                          .build();
                  mlTr = Translation.getClient(opts);
                  mlTr.downloadModelIfNeeded();
                  tts = new TextToSpeech(this, st -> {
                      if (st != TextToSpeech.SUCCESS) {
                          diagTts = "✗ محرك الصوت ما اشتغل";
                          return;
                      }
                      tts.setAudioAttributes(new AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_ASSISTANT)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                              .build());
                      int r = tts.setLanguage(new Locale("ar"));
                      ttsOk = r >= 0;
                      diagTts = ttsOk ? "✓ جاهز" : "✗ العربي مو منزّل في جوالك";
                  });

                  addOverlays();
                  main.post(diagR);

                  if (prefs.getBoolean("listen", true)) loadVoiceModel();
                  else {
                      diagModel = "طافي";
                      diagAudio = "طافي";
                  }
                  return START_NOT_STICKY;
              }

              void startFg() {
                  NotificationManager nm = getSystemService(NotificationManager.class);
                  nm.createNotificationChannel(new NotificationChannel("t", "ترجمان الألعاب", NotificationManager.IMPORTANCE_LOW));
                  Notification n = new Notification.Builder(this, "t")
                          .setContentTitle("ترجمان الألعاب")
                          .setContentText("زر الترجمة شغال")
                          .setSmallIcon(android.R.drawable.ic_menu_view)
                          .build();
                  if (Build.VERSION.SDK_INT >= 30) {
                      int types = ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION;
                      if (hasMic()) types |= ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE;
                      try {
                          startForeground(1, n, types);
                      } catch (Exception e) {
                          startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION);
                      }
                  } else if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION);
                  } else {
                      startForeground(1, n);
                  }
              }

              int dp(int v) {
                  return Math.round(v * getResources().getDisplayMetrics().density);
              }

              GradientDrawable round(int color, int r) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(r);
                  return g;
              }

              Rect screen() {
                  if (Build.VERSION.SDK_INT >= 30) return wm.getCurrentWindowMetrics().getBounds();
                  DisplayMetrics dm = new DisplayMetrics();
                  wm.getDefaultDisplay().getRealMetrics(dm);
                  return new Rect(0, 0, dm.widthPixels, dm.heightPixels);
              }

              WindowManager.LayoutParams overlayParams(boolean touchable) {
                  int flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                          | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS;
                  if (!touchable) flags |= WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE;
                  WindowManager.LayoutParams p = new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY, flags, PixelFormat.TRANSLUCENT);
                  if (Build.VERSION.SDK_INT >= 30) {
                      p.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS;
                  } else if (Build.VERSION.SDK_INT >= 28) {
                      p.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  }
                  return p;
              }

              TextView subView() {
                  TextView t = new TextView(this);
                  t.setTextColor(Color.WHITE);
