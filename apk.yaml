                      sp.gravity = Gravity.BOTTOM | Gravity.LEFT;
                      sp.x = Math.max(0, Math.min(sc.width() - w, box.centerX() - w / 2));
                      sp.y = Math.max(0, sc.height() - box.bottom - padY);
                  } else {
                      sub.setTextSize(TypedValue.COMPLEX_UNIT_SP, big ? 24 : 18);
                      sub.setBackground(round(0xD9000000, dp(14)));
