              @SuppressLint("MissingPermission")
              void startAudio() {
                  if (Build.VERSION.SDK_INT < 29) {
                      diagAudio = "✗ يحتاج أندرويد ١٠ أو أحدث";
                      return;
                  }
                  try {
                      AudioPlaybackCaptureConfiguration cfg = new AudioPlaybackCaptureConfiguration.Builder(mp)
                              .addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                              .addMatchingUsage(AudioAttributes.USAGE_GAME)
                              .addMatchingUsage(AudioAttributes.USAGE_UNKNOWN)
                              .build();
                      AudioFormat fmt = new AudioFormat.Builder()
                              .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                              .setSampleRate(16000)
                              .setChannelMask(AudioFormat.CHANNEL_IN_MONO)
                              .build();
                      int min = AudioRecord.getMinBufferSize(16000, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT);
                      ar = new AudioRecord.Builder()
                              .setAudioFormat(fmt)
                              .setBufferSizeInBytes(Math.max(min, 32000))
                              .setAudioPlaybackCaptureConfig(cfg)
                              .build();
                      ar.startRecording();
                  } catch (Exception e) {
                      diagAudio = "✗ ما قدرت أسمع صوت اللعبة";
                      ar = null;
                      return;
                  }
                  audioOn = true;
                  audioThread = new Thread(this::audioLoop, "audio");
                  audioThread.start();
              }

              void audioLoop() {
                  byte[] buf = new byte[3200];
                  long lastPartial = 0;
                  while (audioOn) {
                      int n;
                      try {
                          n = ar.read(buf, 0, buf.length);
                      } catch (Exception e) {
                          break;
                      }
                      if (n <= 0) continue;
                      long sum = 0;
                      for (int i = 0; i + 1 < n; i += 2) {
                          int s = (short) ((buf[i] & 0xff) | (buf[i + 1] << 8));
                          sum += (long) s * s;
                      }
                      double rms = Math.sqrt(sum / Math.max(1.0, n / 2.0));
                      long now = System.currentTimeMillis();
                      if (rms > 150) lastSoundAt = now;

                      Recognizer r = vrec;
                      if (r == null || !running) continue;
                      try {
                          if (r.acceptWaveForm(buf, n)) {
                              String text = jsonText(r.getResult(), "text");
                              if (!text.isEmpty()) {
                                  heard = text;
                                  final String t = text;
                                  main.post(() -> onHeard(t));
                              }
                          } else if (now - lastPartial > 400) {
                              lastPartial = now;
                              String p = jsonText(r.getPartialResult(), "partial");
                              if (!p.isEmpty()) heard = p;
                          }
                      } catch (Exception ignored) {
                      }
                  }
              }

              static String jsonText(String json, String key) {
                  try {
                      return new JSONObject(json).optString(key, "").trim();
                  } catch (Exception e) {
                      return "";
                  }
              }

              void onHeard(String en) {
                  if (!running) return;
                  if (en.split("\\s+").length < 2) return;
                  // إذا اللعبة فيها ترجمة مكتوبة، هي اللي تنترجم
                  if (System.currentTimeMillis() - lastOcrAt < 4000) return;
                  if (sim(en, lastHeardDone) > 0.8) return;
                  lastHeardDone = en;
                  tr(en, ar -> {
                      if (!running) return;
                      showVoice(ar);
                      say(ar, 0.9f);
                  });
              }

              /* ---------- الترجمة والنطق ---------- */
              void tr(String en, Consumer<String> cb) {
                  String c = cache.get(en);
                  if (c != null) {
                      cb.accept(c);
                      return;
                  }
                  net.execute(() -> {
                      String out = gtx(en);
                      if (out != null) {
                          main.post(() -> {
                              cache.put(en, out);
                              cb.accept(out);
                          });
                      } else {
                          main.post(() -> mlTr.translate(en)
                                  .addOnSuccessListener(r -> {
                                      cache.put(en, r);
                                      cb.accept(r);
                                  })
                                  .addOnFailureListener(e -> showMsg("الترجمة ما اشتغلت، تأكد من الإنترنت")));
                      }
                  });
              }

              static String gtx(String q) {
                  HttpURLConnection c = null;
                  try {
                      URL u = new URL("https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ar&dt=t&q="
                              + URLEncoder.encode(q, "UTF-8"));
                      c = (HttpURLConnection) u.openConnection();
                      c.setConnectTimeout(5000);
                      c.setReadTimeout(5000);
                      BufferedReader r = new BufferedReader(new InputStreamReader(c.getInputStream(), "UTF-8"));
                      StringBuilder sb = new StringBuilder();
                      String l;
                      while ((l = r.readLine()) != null) sb.append(l);
                      r.close();
                      JSONArray a = new JSONArray(sb.toString()).getJSONArray(0);
                      StringBuilder o = new StringBuilder();
                      for (int i = 0; i < a.length(); i++) {
                          JSONArray x = a.optJSONArray(i);
                          if (x != null && !x.isNull(0)) o.append(x.getString(0));
                      }
                      return o.length() > 0 ? o.toString() : null;
                  } catch (Exception e) {
                      return null;
                  } finally {
                      if (c != null) c.disconnect();
                  }
              }

              void say(String ar, float pitch) {
                  if (!ttsOk || !prefs.getBoolean("speak", true)) return;
                  tts.setPitch(pitch);
                  tts.setSpeechRate(1.05f);
                  tts.speak(ar, TextToSpeech.QUEUE_FLUSH, null, "u");
              }

              @Override
              public void onDestroy() {
                  running = false;
                  audioOn = false;
                  if (main != null) {
                      main.removeCallbacks(diagR);
                      main.removeCallbacks(hideR);
                      main.removeCallbacks(hideV);
                  }
                  try {
                      if (ar != null) {
                          ar.stop();
                          ar.release();
                      }
                  } catch (Exception ignored) {
                  }
                  try {
                      if (audioThread != null) audioThread.join(500);
                  } catch (Exception ignored) {
                  }
                  try {
                      if (vrec != null) vrec.close();
                  } catch (Exception ignored) {
                  }
                  try {
                      if (vmodel != null) vmodel.close();
                  } catch (Exception ignored) {
                  }
                  for (View v : new View[]{bubbleBox, sub, vsub}) {
                      try {
                          if (v != null) wm.removeView(v);
                      } catch (Exception ignored) {
                      }
                  }
                  bubbleBox = null;
                  sub = null;
                  vsub = null;
                  diag = null;
                  try {
                      if (vd != null) vd.release();
                  } catch (Exception ignored) {
                  }
                  MediaProjection p = mp;
                  mp = null;
                  try {
                      if (p != null) p.stop();
                  } catch (Exception ignored) {
                  }
                  try {
                      if (reader != null) reader.close();
                  } catch (Exception ignored) {
                  }
                  try {
                      if (recog != null) recog.close();
                  } catch (Exception ignored) {
                  }
                  try {
                      if (mlTr != null) mlTr.close();
                  } catch (Exception ignored) {
                  }
                  try {
                      if (tts != null) tts.shutdown();
                  } catch (Exception ignored) {
                  }
                  if (thread != null) thread.quitSafely();
                  net.shutdownNow();
                  super.onDestroy();
              }
          }
          __END__
