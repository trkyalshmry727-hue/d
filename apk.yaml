              /* ---------- قراءة الشاشة ---------- */
              final Runnable loop = new Runnable() {
                  @Override
                  public void run() {
                      if (!running) return;
                      if (!busy) {
                          busy = true;
                          startGrab();
                      }
                      bg.postDelayed(this, (subShown || vsubShown) ? 1000 : 750);
                  }
              };

              void drain() {
                  try {
                      Image i = reader.acquireLatestImage();
                      if (i != null) i.close();
                  } catch (Exception ignored) {
                  }
              }

              // نخفي الترجمة لحظة عشان نشوف الإنجليزي اللي تحتها
              void startGrab() {
                  if (subShown || vsubShown) {
                      drain();
                      main.post(() -> {
                          if (sub != null) sub.setAlpha(0f);
                          if (vsub != null) vsub.setAlpha(0f);
                      });
                      bg.postDelayed(this::capture, 90);
                  } else {
                      capture();
                  }
              }

              void restoreSubs() {
                  main.post(() -> {
                      if (sub != null) sub.setAlpha(1f);
                      if (vsub != null) vsub.setAlpha(1f);
                  });
              }

              void capture() {
                  Image img = null;
                  try {
                      img = reader.acquireLatestImage();
                  } catch (Exception ignored) {
                  }
                  restoreSubs();
                  if (img == null) {
                      busy = false;
                      return;
                  }
                  Bitmap full;
                  try {
                      Image.Plane pl = img.getPlanes()[0];
                      ByteBuffer buf = pl.getBuffer();
                      int ps = pl.getPixelStride(), rs = pl.getRowStride();
                      int pad = rs - ps * W;
                      full = Bitmap.createBitmap(W + pad / ps, H, Bitmap.Config.ARGB_8888);
                      full.copyPixelsFromBuffer(buf);
                  } catch (Exception e) {
                      busy = false;
                      return;
                  } finally {
                      img.close();
                  }

                  if (isBlack(full)) {
                      diagScreen = "✗ توصلني سوداء";
                      long now = System.currentTimeMillis();
                      if (blackSince == 0) blackSince = now;
                      else if (now - blackSince > 8000 && !warned) {
                          warned = true;
                          main.post(() -> showMsg("الشاشة توصلني سوداء — يمكن تطبيق سوني يمنع قراءة الشاشة"));
                      }
                      full.recycle();
                      busy = false;
                      return;
                  }
                  diagScreen = "✓ تنقرأ";
                  blackSince = 0;

                  final int x0 = (int) (W * 0.06f), x1 = (int) (W * 0.94f);
                  final int y0 = (int) (H * 0.70f), y1 = (int) (H * 0.98f);
                  Bitmap crop = Bitmap.createBitmap(full, x0, y0, x1 - x0, y1 - y0);
                  if (crop != full) full.recycle();

                  recog.process(InputImage.fromBitmap(crop, 0))
                          .addOnSuccessListener(result -> {
                              busy = false;
                              onResult(result, x0, y0);
                          })
                          .addOnFailureListener(e -> busy = false);
              }

              boolean isBlack(Bitmap b) {
                  int max = 0;
                  int w = b.getWidth(), h = b.getHeight();
                  for (int i = 1; i < 20; i++) {
                      for (int j = 1; j < 12; j++) {
                          int c = b.getPixel(w * i / 20, h * j / 12);
                          int v = (Color.red(c) + Color.green(c) + Color.blue(c)) / 3;
                          if (v > max) max = v;
                      }
                  }
                  return max < 16;
              }

              void onResult(Text result, int x0, int y0) {
                  final int cw = (int) (W * 0.94f) - x0;
                  StringBuilder sb = new StringBuilder();
                  Rect box = null;
                  int lines = 0;
                  for (Text.TextBlock b : result.getTextBlocks()) {
                      String c = clean(b.getText());
                      Rect r = b.getBoundingBox();
                      if (c.isEmpty() || r == null) continue;
                      // ترجمة الألعاب تكون بالنص، نتجاهل الخريطة والكلام اللي على الأطراف
                      if (r.centerX() < cw * 0.2f || r.centerX() > cw * 0.8f) continue;
                      if (sb.length() > 0) sb.append(' ');
                      sb.append(c);
                      lines += Math.max(1, b.getLines().size());
                      if (box == null) box = new Rect(r);
                      else box.union(r);
                  }
                  Rect screenBox = null;
                  if (box != null) {
                      Rect sc = screen();
                      if (sc.width() > sc.height()) {
                          float k = sc.width() / (float) W;
                          screenBox = new Rect(
                                  Math.round((box.left + x0) * k), Math.round((box.top + y0) * k),
                                  Math.round((box.right + x0) * k), Math.round((box.bottom + y0) * k));
                      }
                  }
                  onText(sb.toString(), screenBox, lines);
              }

              /* ---------- النص ---------- */
              static String norm(String s) {
                  return s.toLowerCase(Locale.ROOT).replaceAll("[^a-z0-9 ]", "").replaceAll("\\s+", " ").trim();
              }

              static double sim(String a, String b) {
                  a = norm(a);
                  b = norm(b);
                  if (a.isEmpty() || b.isEmpty()) return 0;
                  if (a.equals(b)) return 1;
                  int m = a.length(), n = b.length();
                  if (Math.abs(m - n) > Math.max(m, n) * 0.5) return 0;
                  int[] prev = new int[n + 1];
                  for (int j = 0; j <= n; j++) prev[j] = j;
                  for (int i = 1; i <= m; i++) {
                      int[] cur = new int[n + 1];
                      cur[0] = i;
                      for (int j = 1; j <= n; j++) {
                          int cost = a.charAt(i - 1) == b.charAt(j - 1) ? 0 : 1;
                          cur[j] = Math.min(Math.min(prev[j] + 1, cur[j - 1] + 1), prev[j - 1] + cost);
                      }
                      prev = cur;
                  }
                  return 1.0 - (double) prev[n] / Math.max(m, n);
              }

              static String clean(String raw) {
                  if (raw == null) return "";
                  String t = raw.replaceAll("[|_~`^<>{}\\[\\]\\\\@#*=]", " ").replaceAll("\\s+", " ").trim();
                  t = t.replaceAll("^[^A-Za-z\"'(]+", "");
                  if (t.length() < 3) return "";
                  int letters = 0;
                  for (int i = 0; i < t.length(); i++) if (Character.isLetter(t.charAt(i))) letters++;
                  if (letters < t.length() * 0.55) return "";
                  int words = 0;
                  for (String w : t.split(" ")) if (w.replaceAll("[^A-Za-z]", "").length() >= 2) words++;
                  if (words < 2) return "";
                  return t;
              }

              void onText(String raw, Rect box, int lines) {
                  if (!running) return;
                  String t = clean(raw);
                  if (t.isEmpty()) {
                      pending = "";
                      pendingCount = 0;
                      if (subShown && ++emptyCount >= 2) {
                          hideSub();
                          lastDone = "";
                      }
                      return;
                  }
                  lastRead = t;
                  lastOcrAt = System.currentTimeMillis();
                  emptyCount = 0;
                  if (sim(t, pending) > 0.9) pendingCount++;
                  else {
                      pending = t;
                      pendingCount = 0;
                      return;
                  }
                  if (pendingCount != 1) return;
                  if (sim(t, lastDone) > 0.85) return;
                  lastDone = t;

                  String name = null, line = t;
                  Matcher m = SPEAKER.matcher(t);
                  if (m.matches() && m.group(1).trim().split("\\s+").length <= 3) {
                      name = m.group(1).trim();
                      line = m.group(2).trim();
                  }
                  final String who = name;
                  tr(line, ar -> {
                      if (!running) return;
                      showTrans(who != null ? who + ": " + ar : ar, box, lines);
                      hideVoice();
                      float pitch = who == null ? 0.95f : 0.75f + (Math.abs(who.hashCode()) % 7) * 0.08f;
                      say(ar, pitch);
                  });
              }

