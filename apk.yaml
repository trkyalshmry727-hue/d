                          LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  dl.topMargin = dp(4);
                  bubbleBox.addView(bubble);
                  bubbleBox.addView(diag, dl);
                  diag.setVisibility(prefs.getBoolean("diag", true) ? View.VISIBLE : View.GONE);

                  bp = overlayParams(true);
                  bp.gravity = Gravity.TOP | Gravity.LEFT;
                  bp.x = dp(12);
                  bp.y = dp(40);
                  bubble.setOnTouchListener(new View.OnTouchListener() {
                      int sx, sy;
                      float tx, ty;
                      boolean moved;

                      @Override
                      public boolean onTouch(View v, MotionEvent e) {
                          switch (e.getAction()) {
                              case MotionEvent.ACTION_DOWN:
                                  sx = bp.x;
                                  sy = bp.y;
                                  tx = e.getRawX();
                                  ty = e.getRawY();
                                  moved = false;
                                  return true;
                              case MotionEvent.ACTION_MOVE:
                                  float dx = e.getRawX() - tx, dy = e.getRawY() - ty;
                                  if (Math.abs(dx) + Math.abs(dy) > dp(8)) moved = true;
                                  if (moved) {
                                      bp.x = sx + (int) dx;
                                      bp.y = sy + (int) dy;
                                      try {
                                          wm.updateViewLayout(bubbleBox, bp);
                                      } catch (Exception ignored) {
                                      }
                                  }
                                  return true;
                              case MotionEvent.ACTION_UP:
                                  if (!moved) toggle();
                                  return true;
                          }
                          return false;
                      }
                  });
                  wm.addView(bubbleBox, bp);

                  // ترجمة النص (مكان الكلام الإنجليزي)
                  sub = subView();
                  sp = overlayParams(false);
                  sp.gravity = Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL;
                  wm.addView(sub, sp);

                  // ترجمة الصوت (تحت بالنص)
                  vsub = subView();
                  vp = overlayParams(false);
                  vp.gravity = Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL;
                  wm.addView(vsub, vp);
              }

