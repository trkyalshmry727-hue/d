      - name: بناء التطبيق
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: نشر ملف التثبيت
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk tarjuman.apk
          gh release delete apk --yes --cleanup-tag --repo "${{ github.repository }}" || true
          sleep 3
          gh release create apk tarjuman.apk --repo "${{ github.repository }}" --title "ترجمان الألعاب" --notes "اضغط tarjuman.apk عشان تنزّل التطبيق"

      - name: حفظ نسخة احتياطية
        uses: actions/upload-artifact@v4
        with:
          name: tarjuman-apk
          path: tarjuman.apk
